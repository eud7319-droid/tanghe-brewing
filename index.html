<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>汤河酿序</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#211710; }
    #unity-container.unity-desktop,#unity-container.unity-mobile {
      position:fixed; inset:0; transform:none; display:grid; place-items:center; width:100%; height:100%;
    }
    #unity-canvas.unity-mobile,#unity-canvas {
      display:block; position:static; width:min(100vw,calc(100dvh * 16 / 9)) !important;
      height:auto !important; aspect-ratio:16 / 9; touch-action:none;
    }
    #unity-footer { display:none; }
    #unity-warning { position:absolute; z-index:2; width:min(80vw,600px); }
    #web-controls { position:fixed; inset:auto 0 max(12px,env(safe-area-inset-bottom)); z-index:3;
      display:flex; justify-content:center; gap:8px; pointer-events:none; }
    #web-controls button { pointer-events:auto; color:#f8e8bf; background:#352318; border:1px solid #c59f6f;
      border-radius:18px; padding:7px 13px; font:14px system-ui,sans-serif; }
    #web-controls button[hidden] { display:none; }
    #rotate-game { display:none; }
    @media (orientation:portrait) {
      html[data-game-ready] .unity-mobile ~ #web-controls #rotate-game { display:block; }
      #unity-container.unity-mobile[data-rotated] #unity-canvas {
        position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(90deg);
        width:min(100dvh,calc(100vw * 16 / 9)) !important;
        height:min(100vw,calc(100dvh * 9 / 16)) !important;
      }
    }
  </style>
</head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">汤河酿序</div>
      </div>
    </div>
    <div id="web-controls">
      <button id="enable-audio" type="button" hidden>开启声音</button>
      <button id="rotate-game" type="button" aria-pressed="false">横屏游玩</button>
    </div>
<script>
(() => {
  const dataUrl = new URL("Build/dist.data.unityweb", document.baseURI);
  const assets = {[dataUrl.href]: {"size": 34302142, "parts": ["Build/dist.data.unityweb.part00", "Build/dist.data.unityweb.part01"]}};
  const fetchAsset = window.fetch.bind(window);
  window.fetch = (request, options) => {
    const url = new URL(typeof request === 'string' ? request : (request.url || request), document.baseURI);
    const entry = assets[url.href];
    if (!entry) return fetchAsset(request, options);
    const parts = entry.parts[Symbol.iterator]();
    let reader;
    const stream = new ReadableStream({
      async pull(controller) {
        if (!reader) {
          const part = parts.next();
          if (part.done) { controller.close(); return; }
          const response = await fetchAsset(part.value, options);
          if (!response.ok || !response.body) throw new Error('无法加载游戏资源');
          reader = response.body.getReader();
        }
        const next = await reader.read();
        if (next.done) { reader.releaseLock(); reader = undefined; return this.pull(controller); }
        controller.enqueue(next.value);
      },
      async cancel() { if (reader) await reader.cancel(); }
    });
    return Promise.resolve(new Response(stream, {headers: {'Content-Type':'application/octet-stream','Content-Length':String(entry.size)}}));
  };
})();
</script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      const gameContainer = document.querySelector("#unity-container");
      const portrait = matchMedia("(orientation:portrait)");
      const rotateButton = document.querySelector("#rotate-game");
      const audioButton = document.querySelector("#enable-audio");
      const webGame = window.tangheWebGame = {
        isRotated: () => portrait.matches && gameContainer.hasAttribute("data-rotated"),
        canvasPoint(x, y, rect) {
          return this.isRotated() ? [y - rect.top, rect.right - x] : [x - rect.left, y - rect.top];
        },
        audioContext: null
      };
      rotateButton.addEventListener("click", () => {
        const rotated = gameContainer.toggleAttribute("data-rotated");
        rotateButton.setAttribute("aria-pressed", String(rotated));
        rotateButton.textContent = rotated ? "退出横屏" : "横屏游玩";
      });

      function connectAudio(unityInstance) {
        audioButton.hidden = false;
        let gameAudioStarted = false;
        function enableAudio() {
          const context = webGame.audioContext;
          if (!context || context.state === "closed") return;
          const resumed = context.state === "running" ? Promise.resolve() : context.resume();
          resumed.then(() => { audioButton.hidden = context.state === "running"; })
            .catch(() => { audioButton.hidden = false; });
          if (!gameAudioStarted) {
            gameAudioStarted = true;
            unityInstance.SendMessage("汤河酿序", "Unlock");
          }
        }
        for (const type of ["pointerup", "touchend", "click"]) {
          document.addEventListener(type, enableAudio, {capture:true, passive:true});
        }
        webGame.audioContext?.addEventListener("statechange", () => {
          audioButton.hidden = gameAudioStarted && webGame.audioContext.state === "running";
        });
      }

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/dist.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/dist.data.unityweb",
        frameworkUrl: buildUrl + "/dist.mobile2.framework.js",
        codeUrl: buildUrl + "/dist.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Tanghe",
        productName: "汤河酿序",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.4);


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => { document.documentElement.dataset.gameReady = "true";
                document.querySelector("#unity-loading-bar").style.display = "none";
                connectAudio(unityInstance);
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  </body>
</html>
